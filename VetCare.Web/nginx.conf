server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Não anuncia a versão do nginx nas respostas e páginas de erro.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cabeçalhos de segurança. Um "location" que declara qualquer add_header não herda
    # os do bloco server, por isso eles se repetem dentro de cada um.
    #
    # O CSP só deixa rodar script do próprio portal: mesmo que um texto malicioso escape
    # da tela, ele não executa nem envia o token para outro endereço. __API_URL__ é
    # trocado pelo endereço da API no build da imagem (veja o Dockerfile). O estilo
    # inline é necessário na janela de impressão, que herda esta política.

    # Os arquivos com hash no nome nunca mudam de conteúdo, então podem ser
    # guardados em cache por muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: __API_URL__; media-src 'self' blob: __API_URL__; connect-src 'self' __API_URL__; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # A aplicação usa rotas do lado do cliente: qualquer caminho desconhecido
    # precisa devolver o index.html para o React Router assumir a navegação.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: __API_URL__; media-src 'self' blob: __API_URL__; connect-src 'self' __API_URL__; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
